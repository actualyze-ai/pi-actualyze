version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # @types/node tracks the oldest supported Node major (engines.node),
      # so newer majors would type-check APIs that Node 22 lacks.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # The pi packages move together and include major versions, because
      # the host SDK packages are released in lockstep.
      pi:
        patterns:
          - "@earendil-works/*"
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns:
          - "@earendil-works/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
