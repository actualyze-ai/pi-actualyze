name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    uses: actualyze-ai/oss-workflows/.github/workflows/release-npm.yml@9a9312da0904398522c8f9b26b166588afe6e1f1 # v1.1.1
    permissions:
      contents: write
      id-token: write
    with:
      # Approval of the release environment is the only human check; once
      # it is approved, the publish job makes the version public on npm.
      publish-mode: direct
