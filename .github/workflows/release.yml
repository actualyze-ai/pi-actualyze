name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    uses: actualyze-ai/oss-workflows/.github/workflows/release-npm.yml@5afd3201d2dfad253a3df7c90a96e1964b3168e3 # v1.1.0
    permissions:
      contents: write
      id-token: write
    with:
      # Approval of the release environment is the only human check; once
      # it is approved, the publish job makes the version public on npm.
      publish-mode: direct
