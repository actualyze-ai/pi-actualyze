name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    uses: actualyze-ai/workflows/.github/workflows/release-npm.yml@5749de438e73eaa028d5331066c98a1764b5072d
    permissions:
      contents: write
      id-token: write
