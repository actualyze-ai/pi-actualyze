name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    uses: actualyze-ai/oss-workflows/.github/workflows/release-npm.yml@d4a548bca701986d7cbcbae463f1914e5c5283fa # v1.0.0
    permissions:
      contents: write
      id-token: write
