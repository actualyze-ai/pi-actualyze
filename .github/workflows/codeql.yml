name: CodeQL

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: codeql
    uses: actualyze-ai/oss-workflows/.github/workflows/codeql.yml@d4a548bca701986d7cbcbae463f1914e5c5283fa # v1.0.0
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
