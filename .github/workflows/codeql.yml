name: CodeQL

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: codeql
    uses: actualyze-ai/workflows/.github/workflows/codeql.yml@5749de438e73eaa028d5331066c98a1764b5072d
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
