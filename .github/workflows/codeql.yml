name: CodeQL

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: codeql
    uses: actualyze-ai/oss-workflows/.github/workflows/codeql.yml@5afd3201d2dfad253a3df7c90a96e1964b3168e3 # v1.1.0
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
