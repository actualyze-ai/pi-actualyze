name: Contract tests

on:
  schedule:
    - cron: "53 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  contract-tests:
    name: contract-tests
    uses: actualyze-ai/oss-workflows/.github/workflows/contract-tests.yml@5afd3201d2dfad253a3df7c90a96e1964b3168e3 # v1.1.0
    permissions:
      contents: read
      issues: write
    # The key is passed explicitly and is expected to come from the
    # contract-tests environment, where the called job runs. If the job
    # reports the key missing, pass `secrets: inherit` here instead.
    secrets:
      ACTUALYZE_API_KEY: ${{ secrets.ACTUALYZE_API_KEY }}
