name: Contract tests

on:
  schedule:
    - cron: "53 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  contract-tests:
    name: contract-tests
    uses: actualyze-ai/oss-workflows/.github/workflows/contract-tests.yml@9a9312da0904398522c8f9b26b166588afe6e1f1 # v1.1.1
    permissions:
      contents: read
      issues: write
    # The key is passed explicitly and is expected to come from the
    # contract-tests environment, where the called job runs. If the job
    # reports the key missing, pass `secrets: inherit` here instead.
    secrets:
      ACTUALYZE_API_KEY: ${{ secrets.ACTUALYZE_API_KEY }}
