name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    uses: actualyze-ai/workflows/.github/workflows/node-ci.yml@f703ff6490ac465fe8b32858ddd8222aab737427
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      node-versions: '["22", "24"]'
