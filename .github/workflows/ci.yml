name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    uses: actualyze-ai/oss-workflows/.github/workflows/node-ci.yml@d4a548bca701986d7cbcbae463f1914e5c5283fa # v1.0.0
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      node-versions: '["22", "24"]'
