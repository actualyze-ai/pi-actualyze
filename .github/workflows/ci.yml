name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    uses: actualyze-ai/oss-workflows/.github/workflows/node-ci.yml@9a9312da0904398522c8f9b26b166588afe6e1f1 # v1.1.1
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      node-versions: '["22", "24"]'
