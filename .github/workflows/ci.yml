name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    uses: actualyze-ai/oss-workflows/.github/workflows/node-ci.yml@5afd3201d2dfad253a3df7c90a96e1964b3168e3 # v1.1.0
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      node-versions: '["22", "24"]'
