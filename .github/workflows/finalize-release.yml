name: Finalize release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, such as v1.2.3. Its npm version must already be public; a staged publish must be approved first.
        required: true
        type: string

permissions: {}

concurrency:
  group: finalize-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  finalize:
    name: finalize
    uses: actualyze-ai/oss-workflows/.github/workflows/finalize-release.yml@9a9312da0904398522c8f9b26b166588afe6e1f1 # v1.1.1
    permissions:
      actions: read
      contents: write
    with:
      tag: ${{ inputs.tag }}
