name: Finalize release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, such as v1.2.3. Its npm version must already be public; a staged publish must be approved first.
        required: true
        type: string

permissions: {}

concurrency:
  group: finalize-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  finalize:
    name: finalize
    uses: actualyze-ai/oss-workflows/.github/workflows/finalize-release.yml@5afd3201d2dfad253a3df7c90a96e1964b3168e3 # v1.1.0
    permissions:
      actions: read
      contents: write
    with:
      tag: ${{ inputs.tag }}
